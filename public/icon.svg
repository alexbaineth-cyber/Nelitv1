<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#b91c1c"/>
      <stop offset="100%" stop-color="#050505"/>
    </radialGradient>
    <linearGradient id="tvGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e50914"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background with rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGlow)"/>
  <rect x="24" y="24" width="464" height="464" rx="104" stroke="#e50914" stroke-width="8" stroke-opacity="0.3"/>
  
  <!-- Outer TV bezel -->
  <rect x="96" y="128" width="320" height="230" rx="36" fill="#121212" stroke="url(#tvGrad)" stroke-width="12" filter="url(#glow)"/>
  
  <!-- Screen inner display -->
  <rect x="116" y="148" width="280" height="190" rx="20" fill="#000000"/>
  
  <!-- Play triangle symbol -->
  <polygon points="230,195 320,243 230,291" fill="#e50914"/>
  <polygon points="230,195 320,243 230,291" fill="#ffffff" fill-opacity="0.85"/>
  
  <!-- TV Stand Base -->
  <path d="M216 360 L180 400 M296 360 L332 400" stroke="#e50914" stroke-width="12" stroke-linecap="round"/>
  
  <!-- NeliTv glowing top antenna dots -->
  <circle cx="210" cy="95" r="8" fill="#e50914"/>
  <circle cx="302" cy="95" r="8" fill="#e50914"/>
  <line x1="210" y1="95" x2="245" y2="128" stroke="#e50914" stroke-width="6" stroke-linecap="round"/>
  <line x1="302" y1="95" x2="267" y2="128" stroke="#e50914" stroke-width="6" stroke-linecap="round"/>
</svg>
