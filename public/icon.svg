<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Radial Glow -->
    <radialGradient id="bgRadial" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#0c0e18"/>
      <stop offset="70%" stop-color="#04060a"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>

    <!-- Outer Squircle Border Gradient -->
    <linearGradient id="squircleBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9900"/>
      <stop offset="30%" stop-color="#FF007F"/>
      <stop offset="70%" stop-color="#7B00FF"/>
      <stop offset="100%" stop-color="#00D2FF"/>
    </linearGradient>

    <!-- Left Pillar Gradient: Amber to Neon Pink -->
    <linearGradient id="leftPillarGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFC000"/>
      <stop offset="40%" stop-color="#FF6600"/>
      <stop offset="85%" stop-color="#FF0066"/>
      <stop offset="100%" stop-color="#FF0088"/>
    </linearGradient>

    <!-- Diagonal Fold Gradient: Warm Orange to Magenta to Deep Violet -->
    <linearGradient id="diagFoldGrad" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#FFA200"/>
      <stop offset="25%" stop-color="#FF2A6D"/>
      <stop offset="55%" stop-color="#E6007A"/>
      <stop offset="80%" stop-color="#9900FF"/>
      <stop offset="100%" stop-color="#5500FF"/>
    </linearGradient>

    <!-- Right Pillar Gradient: Electric Cyan to Deep Vibrant Blue -->
    <linearGradient id="rightPillarGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="40%" stop-color="#0099FF"/>
      <stop offset="80%" stop-color="#0055FF"/>
      <stop offset="100%" stop-color="#3300FF"/>
    </linearGradient>

    <!-- Specular Highlight for 3D Tubular Glass Gloss -->
    <linearGradient id="specularGrip" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="80%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="borderGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="6" result="borderBlur"/>
      <feComposite in="SourceGraphic" in2="borderBlur" operator="over"/>
    </filter>
  </defs>

  <!-- Dark Rounded Squircle Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgRadial)"/>

  <!-- Outer Neon Glowing Squircle Ring -->
  <rect x="36" y="36" width="440" height="440" rx="96" stroke="url(#squircleBorder)" stroke-width="10" stroke-linecap="round" filter="url(#borderGlow)"/>

  <!-- Center 3D Ribbon Letter "N" -->
  <g filter="url(#neonGlow)">
    <!-- 1. LEFT VERTICAL PILLAR (Rounded Tube) -->
    <rect x="112" y="104" width="96" height="304" rx="48" fill="url(#leftPillarGrad)"/>
    <rect x="112" y="104" width="96" height="304" rx="48" fill="url(#specularGrip)"/>

    <!-- 2. RIGHT VERTICAL PILLAR (Rounded Tube) -->
    <rect x="290" y="104" width="96" height="304" rx="48" fill="url(#rightPillarGrad)"/>
    <rect x="290" y="104" width="96" height="304" rx="48" fill="url(#specularGrip)"/>

    <!-- 3. DIAGONAL 3D RIBBON (Overlapping gracefully across the pillars) -->
    <path d="M 124 126
             C 124 102 144 94 172 108
             L 374 380
             C 392 404 368 424 340 410
             L 142 144
             C 128 132 124 128 124 126 Z"
          fill="url(#diagFoldGrad)"/>

    <!-- Diagonal Highlight Shading -->
    <path d="M 140 114
             L 358 392
             C 370 406 364 416 350 406
             L 132 128
             C 126 120 132 108 140 114 Z"
          fill="#ffffff" fill-opacity="0.22"/>
  </g>
</svg>
